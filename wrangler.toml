name = "100re-web"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./Frontend"
binding = "ASSETS"

# 1. PUBLIC WEBSITE: Cloudflare KV for Public Member Profiles
[[kv_namespaces]]
binding = "MEMBERS_KV"
id = "d24f895e1c7e4c9bbe3f8842f39b5675"

# 2. LAB WORKSPACE: Cloudflare D1 Database (Bật lại sau khi tạo database thật trên Cloudflare bằng: npx wrangler d1 create 100re-workspace-db)
# [[d1_databases]]
# binding = "DB"
# database_name = "100re-workspace-db"
# database_id = "a42f8267-2f0e-4aa0-96d1-e3f1b3d8eb03"
# migrations_dir = "migrations"

# 3. ENVIRONMENT CONFIGURATION (5 TB Google Drive Cloud Storage)
[vars]
ADMIN_USERNAME = "100re"
ENVIRONMENT = "development"
GOOGLE_DRIVE_ROOT_FOLDER_ID = "1tQJ4m10OxogcFfihoTzVAvbNamLhx4yq"
